<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Budapest Quiz</title>
  <!-- deploy refresh 2026-06-29: tvinga om Pages-deploy -->
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #fdf6ec;
      --paper: #ffffff;
      --card-border: rgba(170, 120, 60, .14);
      --red: #cd2a3e;        /* paprika / flaggans röd */
      --red-dark: #a51f30;
      --green: #2f8f5b;      /* flaggans grön */
      --green-dark: #236b43;
      --gold: #d99b1c;
      --gold-light: #f0bd47;
      --text: #2c2419;
      --muted: #8a7c69;
      --wrong: #cd2a3e;
      --radius: 18px;
      --shadow: 0 16px 38px -20px rgba(120, 70, 30, .45);
    }

    body {
      background: var(--bg);
      background-image:
        radial-gradient(1100px 520px at 12% -8%, rgba(205, 42, 62, .12), transparent 60%),
        radial-gradient(1000px 620px at 100% 112%, rgba(47, 143, 91, .15), transparent 60%),
        radial-gradient(800px 800px at 90% -10%, rgba(217, 155, 28, .12), transparent 55%);
      background-attachment: fixed;
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: flex-start;
      justify-content: center;
      padding: 1rem 1rem 3rem;
      -webkit-font-smoothing: antialiased;
    }

    #app { width: 100%; max-width: 480px; }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(14px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    @keyframes popIn {
      0%   { opacity: 0; transform: scale(.6); }
      70%  { transform: scale(1.12); }
      100% { opacity: 1; transform: scale(1); }
    }

    .screen { display: none; }
    .screen.active { display: block; animation: fadeUp .45s ease both; }

    .header { text-align: center; padding: 2.25rem 0 1.25rem; }
    .header .emoji {
      font-size: 3.75rem; display: block; margin-bottom: 0.5rem;
      filter: drop-shadow(0 6px 12px rgba(120, 70, 30, .22));
      animation: popIn .6s cubic-bezier(.34, 1.56, .64, 1) both;
    }
    .header h1 {
      font-size: 2.15rem; font-weight: 800; letter-spacing: -.01em;
      background: linear-gradient(135deg, var(--red), var(--gold) 52%, var(--green));
      -webkit-background-clip: text; background-clip: text; color: transparent;
    }
    .header p { color: var(--muted); margin-top: 0.45rem; font-size: 0.92rem; }

    .card {
      position: relative;
      background: var(--paper);
      border: 1px solid var(--card-border);
      border-radius: var(--radius);
      padding: 1.5rem;
      margin: 0.85rem 0;
      box-shadow: var(--shadow);
      overflow: hidden;
    }
    /* Tricolor-strimma längst upp på korten – ungerska flaggan */
    .card::before {
      content: ""; position: absolute; top: 0; left: 0; right: 0; height: 4px;
      background: linear-gradient(90deg, var(--red) 0 33.3%, #ffffff 33.3% 66.6%, var(--green) 66.6%);
    }

    .input-group { margin: 0.5rem 0 1.2rem; }
    .input-group label {
      display: block; color: var(--red); font-size: 0.74rem; font-weight: 700;
      text-transform: uppercase; letter-spacing: .08em; margin-bottom: .55rem;
    }
    .input-group input {
      width: 100%; padding: 1rem 1.2rem; background: #fffdf9;
      border: 2px solid rgba(170, 120, 60, .25); border-radius: 13px;
      color: var(--text); font-size: 1.1rem; outline: none;
      transition: border-color .2s, box-shadow .2s; -webkit-appearance: none;
    }
    .input-group input::placeholder { color: rgba(138, 124, 105, .7); }
    .input-group input:focus {
      border-color: var(--red);
      box-shadow: 0 0 0 4px rgba(205, 42, 62, .12);
    }

    .btn {
      position: relative; display: block; width: 100%; padding: 1.05rem; border: none;
      border-radius: 13px; font-size: 1.05rem; font-weight: 700; cursor: pointer;
      transition: transform .15s, box-shadow .2s, filter .2s;
      text-align: center; -webkit-tap-highlight-color: transparent;
    }
    .btn:active { transform: scale(.975); }
    .btn-primary {
      background: linear-gradient(135deg, #e23a4d, var(--red) 60%, var(--red-dark));
      color: #fff;
      box-shadow: 0 10px 24px -10px rgba(205, 42, 62, .6);
    }
    .btn-primary:active { filter: brightness(.96); }
    .btn-secondary {
      background: #f3ead9; color: var(--text);
      border: 1px solid rgba(170, 120, 60, .2); margin-top: .7rem;
    }
    .btn-secondary:active { background: #ebe0cb; }
    .btn-share {
      background: linear-gradient(135deg, #2fe07a, #25D366 70%, #1da851);
      color: #fff; margin-top: .7rem;
      box-shadow: 0 10px 24px -10px rgba(37, 211, 102, .5);
    }
    .btn-share:active { filter: brightness(.96); }

    .progress-wrap { display: flex; align-items: center; gap: .85rem; margin-bottom: 1.1rem; }
    .progress-bar {
      flex: 1; height: 8px; background: rgba(120, 80, 40, .12);
      border-radius: 4px; overflow: hidden;
      box-shadow: inset 0 1px 2px rgba(120, 70, 30, .12);
    }
    .progress-fill {
      height: 100%; border-radius: 4px; transition: width .45s cubic-bezier(.4, 0, .2, 1);
      background: linear-gradient(90deg, var(--red), var(--gold) 55%, var(--green));
    }
    .progress-label {
      font-size: .82rem; color: var(--muted); font-weight: 700;
      white-space: nowrap; font-variant-numeric: tabular-nums;
    }

    .question-text { font-size: 1.18rem; font-weight: 700; line-height: 1.55; margin-bottom: 1.35rem; }
    .options { display: flex; flex-direction: column; gap: .7rem; }
    .option-btn {
      display: block; width: 100%; padding: .95rem 1.15rem;
      background: #fffdf9; border: 2px solid rgba(170, 120, 60, .2);
      border-radius: 13px; color: var(--text); font-size: .98rem; text-align: left;
      cursor: pointer; transition: transform .15s, border-color .15s, background .15s;
      -webkit-tap-highlight-color: transparent;
    }
    .option-btn:active:not(:disabled) { transform: scale(.98); }
    @media (hover: hover) {
      .option-btn:hover:not(:disabled) { border-color: rgba(205, 42, 62, .55); background: rgba(205, 42, 62, .05); }
    }
    .option-btn.correct { border-color: var(--green); background: rgba(47, 143, 91, .14); color: var(--green-dark); font-weight: 700; }
    .option-btn.wrong { border-color: var(--wrong); background: rgba(205, 42, 62, .1); color: var(--red-dark); }
    .option-btn:disabled { cursor: default; }

    .fun-fact {
      margin-top: 1.1rem; padding: .95rem 1.1rem;
      background: rgba(217, 155, 28, .1); border-left: 3px solid var(--gold);
      border-radius: 0 10px 10px 0; font-size: .9rem; color: #5f5340; line-height: 1.6;
      animation: fadeUp .35s ease both;
    }
    .btn-next { margin-top: 1.1rem; }

    .score-display { text-align: center; padding: 1.25rem 0 .5rem; }
    .score-big {
      font-size: 4.75rem; font-weight: 900; line-height: 1;
      background: linear-gradient(135deg, var(--red), var(--gold) 52%, var(--green));
      -webkit-background-clip: text; background-clip: text; color: transparent;
      animation: popIn .6s cubic-bezier(.34, 1.56, .64, 1) both;
    }
    .score-total { font-size: 1.1rem; color: var(--muted); margin-top: .25rem; }
    .score-msg { margin-top: .85rem; font-size: 1.05rem; font-weight: 600; line-height: 1.5; }

    .lb-title {
      color: var(--red); font-size: .74rem; font-weight: 700;
      text-transform: uppercase; letter-spacing: .1em; margin-bottom: .85rem;
    }
    .lb-row {
      display: flex; align-items: center; gap: .75rem; padding: .65rem .25rem;
      border-bottom: 1px solid rgba(120, 80, 40, .1); border-radius: 8px;
    }
    .lb-row:last-child { border-bottom: none; }
    .lb-row.me { background: rgba(217, 155, 28, .12); margin: 0 -.4rem; padding: .65rem .65rem; }
    .lb-rank { font-size: 1rem; width: 1.9rem; text-align: center; flex-shrink: 0; font-weight: 700; }
    .lb-name { flex: 1; font-size: .98rem; font-weight: 600; }
    .lb-name.me { color: var(--red); }
    .lb-score { font-size: .98rem; font-weight: 700; color: var(--green-dark); font-variant-numeric: tabular-nums; }
    .lb-score .of { color: var(--muted); font-weight: 400; font-size: .82rem; }

    .section-title {
      color: var(--red); font-size: .74rem; font-weight: 700;
      text-transform: uppercase; letter-spacing: .1em; margin: .2rem 0 .8rem;
    }
    .quiz-card {
      display: flex; align-items: center; gap: .9rem; width: 100%; text-align: left;
      padding: 1rem 1.1rem; margin-top: .6rem; background: #fffdf9;
      border: 2px solid rgba(170, 120, 60, .2); border-radius: 13px; cursor: pointer;
      transition: transform .15s, border-color .15s, background .15s;
      -webkit-tap-highlight-color: transparent;
    }
    .quiz-card:first-of-type { margin-top: 0; }
    .quiz-card:active { transform: scale(.98); }
    @media (hover: hover) {
      .quiz-card:hover { border-color: rgba(205, 42, 62, .5); background: rgba(205, 42, 62, .05); }
    }
    .quiz-card .q-emoji { font-size: 1.9rem; flex-shrink: 0; }
    .quiz-card .q-info { flex: 1; display: flex; flex-direction: column; }
    .quiz-card .q-title { font-weight: 800; font-size: 1.02rem; color: var(--text); }
    .quiz-card .q-blurb { color: var(--muted); font-size: .82rem; margin-top: .15rem; }
    .quiz-card .q-arrow { color: var(--red); font-weight: 800; font-size: 1.2rem; flex-shrink: 0; }

    .share-hint { font-size: .82rem; color: var(--muted); text-align: center; margin-top: .6rem; }

    .toast {
      position: fixed; bottom: 2rem; left: 50%;
      transform: translateX(-50%) translateY(80px);
      background: linear-gradient(135deg, #2fe07a, #25D366);
      color: #fff; padding: .75rem 1.5rem;
      border-radius: 100px; font-weight: 700; font-size: .9rem;
      box-shadow: 0 12px 30px -8px rgba(37, 211, 102, .5);
      transition: transform .3s cubic-bezier(.34, 1.56, .64, 1); pointer-events: none;
      white-space: nowrap; z-index: 100;
    }
    .toast.show { transform: translateX(-50%) translateY(0); }
  </style>
</head>
<body>
<div id="app">

  <!-- WELCOME -->
  <div id="screen-welcome" class="screen active">
    <div class="header">
      <span class="emoji">🏛️</span>
      <h1>Budapest Quiz</h1>
      <p>Testa dina kunskaper från resan!</p>
    </div>
    <div id="lb-welcome-wrap" style="display:none">
      <div class="card" id="lb-welcome"></div>
    </div>
    <div class="card">
      <div class="input-group">
        <label>Ditt namn</label>
        <input id="name-input" type="text" placeholder="Skriv ditt namn…" autocomplete="off" autocorrect="off" />
      </div>
      <p class="section-title">Välj quiz</p>
      <div id="quiz-list"></div>
    </div>
  </div>

  <!-- QUIZ -->
  <div id="screen-quiz" class="screen">
    <div class="progress-wrap">
      <div class="progress-bar"><div class="progress-fill" id="progress-fill"></div></div>
      <span class="progress-label" id="progress-label"></span>
    </div>
    <div class="card">
      <div class="question-text" id="question-text"></div>
      <div class="options" id="options"></div>
      <div class="fun-fact" id="fun-fact" style="display:none"></div>
      <button class="btn btn-primary btn-next" id="btn-next" style="display:none" onclick="nextQuestion()">Nästa fråga →</button>
    </div>
  </div>

  <!-- RESULT -->
  <div id="screen-result" class="screen">
    <div class="header">
      <span class="emoji" id="result-emoji">🏆</span>
      <h1 id="result-title"></h1>
    </div>
    <div class="card">
      <div class="score-display">
        <div class="score-big" id="score-big"></div>
        <div class="score-total" id="score-total">av 19 rätt</div>
        <div class="score-msg" id="score-msg"></div>
      </div>
    </div>
    <div class="card" id="lb-result"></div>
    <button class="btn btn-share" onclick="shareResult()">Dela med vänner 🔗</button>
    <p class="share-hint">Alla som spelar hamnar på samma topplista — utmana dina vänner! 🏆</p>
    <button class="btn btn-primary" onclick="playAgain()" style="margin-top:.7rem">Spela igen 🔁</button>
    <button class="btn btn-secondary" onclick="resetQuiz()">Välj en annan dag 🗺️</button>
  </div>

</div>
<div class="toast" id="toast"></div>

<script>
const QUIZZES = {
  budapest: {
    title: 'Lördag', emoji: '🏛️', blurb: 'Gellért, basilikan & Andrássy út',
    questions: [
  {
    q: "Hur varmt är vattnet i Széchenyi-badets bassänger?",
    opts: ["20–24°C", "28–32°C", "36–38°C", "42–46°C"], a: 2,
    fun: "Vattnet pumpas upp ur geotermiska källor med 74°C och kyls ned till 36–38°C. Budapest har över 100 termala källor! 🌊"
  },
  {
    q: "Vilken nationalitet hade Sankt Gellért som missionerade i Ungern på 1000-talet?",
    opts: ["Ungersk", "Tysk", "Venetiansk", "Bysantinsk"], a: 2,
    fun: "Gellért var en venetiansk benediktinmunk som kom till Ungern för att sprida kristendomen."
  },
  {
    q: "Vilket år kastades Sankt Gellért ned från berget av upprorsmakare?",
    opts: ["896", "1000", "1046", "1104"], a: 2,
    fun: "Han kastades ned i en tunna år 1046 av hedniska upprorsmakare — därav bergets namn Gellértberget! 😱"
  },
  {
    q: "Hur hög är Frihetsstatyns figur (Szabadság-szobor) på Gellértberget?",
    opts: ["8 meter", "14 meter", "26 meter", "40 meter"], a: 1,
    fun: "Figuren är 14 m hög och sockeln ytterligare 26 m. Den syns vida omkring över Budapest! 🗽"
  },
  {
    q: "Vilket år restes Frihetsstatyn på Gellértberget?",
    opts: ["1918", "1938", "1947", "1989"], a: 2,
    fun: "Restes 1947 för att hedra den sovjetiska befrielsen. Inskriptioner togs bort efter kommunismens fall 1989! 🕊️"
  },
  {
    q: "I vilken arkitekturstil är Hotel Gellért byggt?",
    opts: ["Nygotik", "Barock", "Art deco", "Art nouveau"], a: 3,
    fun: "Byggt 1918 i art nouveau-stil med karaktäristiska gröna koppartorn och röda tegeltak! 🏨"
  },
  {
    q: "Vilket år grundades Budapest University of Technology (BME)?",
    opts: ["1782", "1848", "1896", "1909"], a: 0,
    fun: "Grundat 1782 — ett av Europas äldsta tekniska universitet! Lite som KTH fast i Budapest. 🎓"
  },
  {
    q: "Hur hög är kupolen på S:t Stefansbasilikan?",
    opts: ["76 meter", "86 meter", "96 meter", "106 meter"], a: 2,
    fun: "Exakt lika högt som parlamentsbyggnaden — 96 m! Ungersk lag förbjöd länge byggnader att vara högre. ⛪"
  },
  {
    q: "Vilket år stod S:t Stefansbasilikan färdig?",
    opts: ["1851", "1870", "1884", "1905"], a: 3,
    fun: "Byggandet tog över 50 år! Grundstenen 1851, invigning 1905. Kupolen rasade dessutom in under byggtiden. 🏛️"
  },
  {
    q: "Vad förvaras som helig relik inuti S:t Stefansbasilikan?",
    opts: ["Kung Stefanus krona", "Kung Stefanus svärd", "Kung Stefanus högerhand", "Kung Stefanus rustning"], a: 2,
    fun: "Kung Stefanus mumifierade högerhand — det s.k. 'Helig Höger' — är ett av Ungerns mest heliga reliker! ✋"
  },
  {
    q: "Vilket UNESCO-listat transportmedel löper under Andrássy út?",
    opts: ["Spårvagn linje 2", "Tunnelbana M1", "Tunnelbana M2", "Buss 16"], a: 1,
    fun: "Tunnelbana M1 öppnade 1896 — Europas näst äldsta metro. Andrássy út är också UNESCO-listat sedan 2002! 🚇"
  },
  {
    q: "Vad heter torget i slutet av Andrássy út?",
    opts: ["Deák Ferenc tér", "Erzsébet tér", "Vörösmarty tér", "Hősök tere"], a: 3,
    fun: "Hősök tere — Hjältarnas torg — med det storslagna Millenniumsmonumentet, rest 1896 till minne av Ungerns 1000-årsdag! 🏆"
  },
  {
    q: "Vilket år bygges Andrássy út?",
    opts: ["1848–1860", "1872–1885", "1896–1910", "1920–1935"], a: 1,
    fun: "Andrássy út byggdes 1872–1885 och är UNESCO-listad sedan 2002 — Budapests egen Champs-Élysées! 🛤️"
  },
  {
    q: "Vilket år öppnade Operahuset (Magyar Állami Operaház) på Andrássy út?",
    opts: ["1872", "1884", "1896", "1905"], a: 1,
    fun: "Operahuset öppnade 1884 och räknas som ett av Europas vackraste — stod klart samma år som Frihetsgudinnan i New York! 🎭"
  },
  {
    q: "Vad finns på Andrássy út nummer 60?",
    opts: ["Ungerska nationalmuseet", "Terrorháza (Terrormuseet)", "Magyar Állami Operaház", "Széchenyi-badet"], a: 1,
    fun: "Terrorháza på nr 60 var f.d. säkerhetspolisens högkvarter under både nazist- och kommunisttiden — nu ett gripande museum! 😶"
  },
  {
    q: "Vilken roll hade Gyula Andrássy — mannen boulevard heter efter?",
    opts: ["Ungersk kung", "Österrike-Ungerns utrikesminister", "Budapests borgmästare", "Byggnadschef för parlamentet"], a: 1,
    fun: "Gyula Andrássy spelade nyckelroll i Ausgleich 1867 — kompromissen som skapade Österrike-Ungern. Han blev Ungerns förste premiärminister och därefter dubbelmonarkins utrikesminister 1871–1879. 🎩"
  },
  {
    q: "Vilket år kröntes Stefanus I till Ungerns förste kung?",
    opts: ["896", "1000", "1046", "1222"], a: 1,
    fun: "Stefanus I kröntes år 1000 och lade grunden för det kristna Ungern. S:t Stefansbasilikan är uppkallad efter honom! 👑"
  }
    ]
  },

  upptackter: {
    title: 'Söndag', emoji: '🗺️', blurb: 'Városliget, Anonymus & Sarajevo',
    questions: [
  {
    q: "Vem ritade Ungerns musikhus (Magyar Zene Háza) i Városliget?",
    opts: ["Sou Fujimoto", "Imre Makovecz", "Ignác Alpár", "Miklós Ybl"], a: 0,
    fun: "Den japanske stjärnarkitekten Sou Fujimoto ritade Musikhuset, invigt 2022. Det svävande guldtaket har hål som släpper in dagsljus — inspirerat av ljus genom lövverk! 🍃"
  },
  {
    q: "Vad är Városliget, där dagens upptäckter ligger?",
    opts: ["En medeltida borg", "En av Europas äldsta offentliga stadsparker", "Budapests finansdistrikt", "Ett gammalt kloster"], a: 1,
    fun: "Városliget (Stadsparken) är en av Europas äldsta offentliga parker och fick sin form till millenniefirandet 1896. Här ligger Vajdahunyad, Széchenyi-badet och zoo! 🌳"
  },
  {
    q: "Vad är speciellt med Vajdahunyad-slottets arkitektur?",
    opts: ["Det är byggt helt i glas", "Det kombinerar flera olika arkitekturstilar", "Det är Ungerns högsta byggnad", "Det ligger under jord"], a: 1,
    fun: "Vajdahunyad är ett 'collage' som blandar romansk, gotisk, renässans- och barockstil i en enda byggnad — ritat av Ignác Alpár. 🏰"
  },
  {
    q: "Vilket år byggdes Vajdahunyad-slottet ursprungligen?",
    opts: ["1848", "1896", "1922", "1956"], a: 1,
    fun: "Det byggdes först i trä för millenniumutställningen 1896 och återuppbyggdes i sten 1904–1908. 🪵→🧱"
  },
  {
    q: "Vilket museum rymmer Vajdahunyad-slottet idag?",
    opts: ["Ungerska lantbruksmuseet", "Nationalgalleriet", "Terrormuseet", "Järnvägsmuseet"], a: 0,
    fun: "Slottet rymmer Ungerska lantbruksmuseet — ett av Europas största i sitt slag. 🌾"
  },
  {
    q: "Vem föreställer den huvklädda Anonymus-statyn vid Vajdahunyad?",
    opts: ["En okänd medeltida krönikör", "Kung Stefanus I", "Greve Dracula", "Arkitekten Alpár"], a: 0,
    fun: "Anonymus var kung Béla III:s notarie och skrev Gesta Hungarorum. Hans riktiga namn är okänt — därför döljer huvan ansiktet. Skulptör: Miklós Ligeti, 1903. ✍️"
  },
  {
    q: "Vad sägs hända om du rör vid Anonymus-statyns penna?",
    opts: ["Du får tur i kärlek", "Du får skrivförmåga och författarlycka", "Du blir rik", "Du återvänder till Budapest"], a: 1,
    fun: "Traditionen säger att den som rör pennspetsen får skrivförmåga — pennan är blanksliten av alla händer! 🖋️"
  },
  {
    q: "Idag den 28 juni — vilket ödesdigert attentat skedde detta datum 1914?",
    opts: ["Mordet på Lincoln", "Attentatet i Sarajevo", "Branden i Reichstag", "Stormningen av Bastiljen"], a: 1,
    fun: "Den 28 juni 1914 sköts Österrike-Ungerns tronföljare Franz Ferdinand i Sarajevo — gnistan som utlöste första världskriget. 💥"
  },
  {
    q: "Vem utförde attentatet i Sarajevo 1914?",
    opts: ["Gavrilo Princip", "Vlad Țepeș", "Lajos Kossuth", "Miklós Horthy"], a: 0,
    fun: "Gavrilo Princip, 19 år, medlem i den serbiska rörelsen 'Svarta handen'. Inom sex veckor var hela Europa i krig. 🕯️"
  },
  {

const QUIZ_ORDER = ['budapest', 'upptackter', 'mandag'];

// Poäng lagras i en delad Supabase-databas så alla ser samma topplista
const SUPABASE_URL = 'https://kcqrkomcbtqbhclqpyri.supabase.co';
const SUPABASE_KEY = 'sb_publishable_mWeCpNkPjMfQVbP4Ytq3Tw_wP9T2TAt';
const SB_HEADERS = { apikey: SUPABASE_KEY, Authorization: 'Bearer ' + SUPABASE_KEY };

// Hämtar alla rader och summerar poängen per spelare (över alla quiz/dagar)
async function fetchScores() {
  try {
    const res = await fetch(`${SUPABASE_URL}/rest/v1/scores?select=name,score`, { headers: SB_HEADERS });
    if (!res.ok) return [];
    const rows = await res.json();
    const totals = {};
    for (const r of rows) totals[r.name] = (totals[r.name] || 0) + (r.score || 0);
    return Object.entries(totals).map(([n, s]) => ({ n, s }));
  } catch { return []; }
}

// En rad per (namn, quiz) — upsert så omspel uppdaterar just det quizets poäng
async function submitScore(name, quiz, sc, total) {
  try {
    const res = await fetch(`${SUPABASE_URL}/rest/v1/scores?on_conflict=name,quiz`, {
      method: 'POST',
      headers: { ...SB_HEADERS, 'Content-Type': 'application/json', 'Prefer': 'resolution=merge-duplicates' },
      body: JSON.stringify({ name, quiz, score: sc, total, updated_at: new Date().toISOString() })
    });
    return res.ok;
  } catch { return false; }
}

let playerName = '', currentQuiz = 'budapest', currentTotal = 0;
let currentQ = 0, score = 0, shuffled = [], answered = false;
let scores = [];

function esc(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}
function shuffle(arr) {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}
function showScreen(id) {
  document.querySelectorAll('.screen').forEach(el => el.classList.remove('active'));
  document.getElementById('screen-' + id).classList.add('active');
  window.scrollTo(0, 0);
}
function toast(msg) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('show');
  setTimeout(() => el.classList.remove('show'), 2600);
}

const MEDALS = ['🥇', '🥈', '🥉'];
function renderLeaderboard(containerId, highlight) {
  const el = document.getElementById(containerId);
  const sorted = [...scores].sort((a, b) => b.s - a.s);
  if (sorted.length === 0) { el.innerHTML = ''; return; }
  el.innerHTML =
    '<p class="lb-title">Total topplista</p>' +
    sorted.map((sc, i) => {
      const isMe = sc.n === highlight;
      const rank = i < 3 ? MEDALS[i] : (i + 1) + '.';
      return `<div class="lb-row${isMe ? ' me' : ''}">
        <span class="lb-rank">${rank}</span>
        <span class="lb-name${isMe ? ' me' : ''}">${esc(sc.n)}${isMe ? ' ← du' : ''}</span>
        <span class="lb-score">${sc.s}<span class="of">p</span></span>
      </div>`;
    }).join('');
}
async function updateWelcomeBoard() {
  const wrap = document.getElementById('lb-welcome-wrap');
  scores = await fetchScores();
  if (scores.length === 0) { wrap.style.display = 'none'; return; }
  wrap.style.display = '';
  renderLeaderboard('lb-welcome', null);
}

function renderQuizList() {
  document.getElementById('quiz-list').innerHTML = QUIZ_ORDER.map(id => {
    const q = QUIZZES[id];
    return `<button class="quiz-card" onclick="startQuiz('${id}')">
      <span class="q-emoji">${q.emoji}</span>
      <span class="q-info">
        <span class="q-title">${esc(q.title)}</span>
        <span class="q-blurb">${esc(q.blurb)} · ${q.questions.length} frågor</span>
      </span>
      <span class="q-arrow">→</span>
    </button>`;
  }).join('');
}

function startQuiz(quizId) {
  playerName = document.getElementById('name-input').value.trim();
  if (!playerName) { document.getElementById('name-input').focus(); return; }
  currentQuiz = quizId;
  currentTotal = QUIZZES[quizId].questions.length;
  currentQ = 0; score = 0; answered = false;
  shuffled = shuffle(QUIZZES[quizId].questions).map(q => {
    const indexed = q.opts.map((o, i) => ({ o, correct: i === q.a }));
    const s = shuffle(indexed);
    return { q: q.q, opts: s.map(x => x.o), a: s.findIndex(x => x.correct), fun: q.fun };
  });
  showScreen('quiz');
  renderQuestion();
}

function renderQuestion() {
  answered = false;
  const q = shuffled[currentQ];
  document.getElementById('progress-fill').style.width = (currentQ / currentTotal * 100) + '%';
  document.getElementById('progress-label').textContent = `${currentQ + 1} / ${currentTotal}`;
  document.getElementById('question-text').textContent = q.q;
  document.getElementById('fun-fact').style.display = 'none';
  document.getElementById('btn-next').style.display = 'none';
  document.getElementById('options').innerHTML = q.opts.map((opt, i) =>
    `<button class="option-btn" onclick="pick(${i})">${esc(opt)}</button>`
  ).join('');
}

function pick(chosen) {
  if (answered) return;
  answered = true;
  const q = shuffled[currentQ];
  document.querySelectorAll('.option-btn').forEach((btn, i) => {
    btn.disabled = true;
    if (i === q.a) btn.classList.add('correct');
    else if (i === chosen) btn.classList.add('wrong');
  });
  if (chosen === q.a) score++;
  document.getElementById('fun-fact').textContent = q.fun;
  document.getElementById('fun-fact').style.display = 'block';
  const nb = document.getElementById('btn-next');
  nb.textContent = currentQ + 1 < currentTotal ? 'Nästa fråga →' : 'Se resultat! 🏁';
  nb.style.display = 'block';
}

function nextQuestion() {
  currentQ++;
  if (currentQ >= currentTotal) finish();
  else renderQuestion();
}

async function finish() {
  const pct = score / currentTotal;
  let emoji, msg;
  if (pct === 1)      { emoji = '🏆'; msg = 'Perfekt! Alla rätt!'; }
  else if (pct >= .8) { emoji = '⭐'; msg = 'Otroligt bra — en riktig kännare!'; }
  else if (pct >= .6) { emoji = '😊'; msg = 'Bra jobbat! Det mesta satt.'; }
  else if (pct >= .4) { emoji = '🤔'; msg = 'Halvvägs — kör en runda till!'; }
  else                { emoji = '😅'; msg = 'Studierna fortsätter… nästa gång bättre!'; }

  document.getElementById('result-emoji').textContent = emoji;
  document.getElementById('result-title').textContent = playerName;
  document.getElementById('score-big').textContent = score;
  document.getElementById('score-total').textContent = 'av ' + currentTotal + ' rätt · ' + QUIZZES[currentQuiz].title;
  document.getElementById('score-msg').textContent = msg;
  document.getElementById('lb-result').innerHTML =
    '<p class="lb-title">Total topplista</p><p style="color:var(--muted);font-size:.9rem">Laddar…</p>';
  showScreen('result');

  await submitScore(playerName, currentQuiz, score, currentTotal);
  scores = await fetchScores();
  renderLeaderboard('lb-result', playerName);
}

function shareResult() {
  const url = location.origin + location.pathname;
  const text = `🏛️ Budapest Quiz\n${playerName} fick ${score}/${currentTotal} rätt i "${QUIZZES[currentQuiz].title}"!\n\nSpela du med — alla hamnar på samma topplista:`;
  if (navigator.share) {
    navigator.share({ title: 'Budapest Quiz', text, url }).catch(() => copyUrl(url));
  } else {
    copyUrl(url);
  }
}
function copyUrl(url) {
  if (navigator.clipboard) {
    navigator.clipboard.writeText(url)
      .then(() => toast('Länk kopierad! Klistra in i chatten ✓'))
      .catch(() => legacyCopy(url));
  } else {
    legacyCopy(url);
  }
}
function legacyCopy(url) {
  const ta = document.createElement('textarea');
  ta.value = url;
  Object.assign(ta.style, { position: 'fixed', opacity: '0', top: '0', left: '0' });
  document.body.appendChild(ta);
  ta.select();
  try { document.execCommand('copy'); toast('Länk kopierad! ✓'); }
  catch { toast('Kopiera länken från adressfältet'); }
  document.body.removeChild(ta);
}

function playAgain() {
  startQuiz(currentQuiz);
}

function resetQuiz() {
  showScreen('welcome');
  updateWelcomeBoard();
}

document.getElementById('name-input').addEventListener('keydown', e => {
  if (e.key === 'Enter') e.target.blur();
});
renderQuizList();
updateWelcomeBoard();
</script>
